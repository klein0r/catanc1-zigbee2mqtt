name: Build and attach app to release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # build.sh reads the "Identity" field of 'docker inspect' (Docker >= 29.2),
      # which is newer than the runner's preinstalled Docker, and relies on the
      # containerd image store
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Install squashfs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Build app
        run: bash build.sh "$RELEASE_TAG"

      # GitHub rejects release assets with the .app extension
      - name: Package app
        run: |
          APP=$(ls zigbee2mqtt_*_arm64.app)
          zip -j "${APP%.app}.zip" "$APP" "${APP%.app}.md5" LICENSE

      - name: Attach app to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            zigbee2mqtt_*_arm64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # GPL-3.0 requires pointing to the Corresponding Source of the bundled image
      - name: Add source code and license notes to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ORG=$(sed -n 's/^ORG=//p' build.sh)
          TAG=$(tr -d '[:space:]' < ZIGBEE2MQTT_VERSION)
          NOTES="$RUNNER_TEMP/notes.md"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$NOTES"

          # A re-run must not add the section twice
          if grep -q '^## Source code and licenses$' "$NOTES"; then
            exit 0
          fi

          cat >> "$NOTES" <<EOF

          ## Source code and licenses

          This app bundles the unmodified Docker image \`${ORG}:${TAG}\`.

          - **zigbee2mqtt ${TAG}** is licensed under GPL-3.0. Source code: https://github.com/Koenkk/zigbee2mqtt/tree/${TAG}
          - **Packaging** (build script, app manifest, Quadlet unit) is licensed under GPL-3.0. Source code: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${RELEASE_TAG}
          - The image also contains third-party components under their own licenses: Alpine Linux packages (source: https://gitlab.alpinelinux.org/alpine/aports), Node.js and the npm dependencies of zigbee2mqtt (see \`pnpm-lock.yaml\` in the zigbee2mqtt source). Their source code is available from the respective projects.
          EOF

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
